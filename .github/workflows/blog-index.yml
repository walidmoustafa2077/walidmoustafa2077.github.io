name: Build blog index

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "scripts/build-blog.js"
      - ".github/workflows/blog-index.yml"
  # Runs daily so a post dated in the future appears on the right day
  # without anyone pushing a commit.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan blog/ and rebuild the index
        run: node scripts/build-blog.js

      - name: Commit the regenerated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts.json blog/posts.js
          if git diff --staged --quiet; then
            echo "Index already up to date."
            exit 0
          fi
          git commit -m "chore(blog): rebuild post index [skip ci]"
          git push
